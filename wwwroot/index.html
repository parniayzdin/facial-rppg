<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse — camera preview</title><link rel="stylesheet" href="/style.css?v=3"><script type="module" src="/app.js?v=feedback-2"></script></head><body><main>
<header><h1>Pulse<span>camera experiment</span></h1><span class="tag">PREVIEW</span></header>
<section class="workspace"><div class="camera"><video id="video" muted playsinline autoplay></video><canvas id="overlay"></canvas><div id="empty"><svg width="76" height="100" viewBox="0 0 76 100" fill="none" stroke="currentColor" stroke-width="1.2"><ellipse cx="38" cy="31" rx="19" ry="25"/><path d="M4 98c0-43 68-43 68 0"/></svg><p>Your camera appears here</p></div><span id="tracking">Camera off</span></div>
<aside><div class="reading"><span class="label">HEART RATE ESTIMATE</span><div class="value"><strong id="bpm">—</strong><span>bpm</span></div><p id="status" role="status">Loading face detector…</p></div><progress id="progress" max="20" value="0" aria-label="Steady video collected"></progress><canvas id="signal" width="460" height="110" aria-label="Facial colour signal, not an ECG"></canvas><span class="signal-label">Facial colour signal</span><button id="start" disabled>Start camera</button><p id="hint" class="hint">Face the light. Hold still for at least 20 seconds.</p></aside></section>
<p id="error" role="alert" hidden></p><footer><span>Experimental demo · not a medical device</span><span>Video stays in your browser</span></footer>
</main></body></html>
